name: Native quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: native-bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; shared repository pin
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; shared repository pin
        with:
          python-version: '3.12.10'
      - name: Install hashed build tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r toolchains/build-tools.txt
      - name: Configure, build and verify on Linux
        if: runner.os == 'Linux'
        run: |
          python tools/bootstrap.py
          python tests/protocol_mutation.py --build-dir build/linux-headless --evidence-dir artifacts/protocol-mutation
          python tests/objects_mutation.py --build-dir build/linux-headless --evidence-dir artifacts/objects-mutation
          python tests/sdk_mutation.py --build-dir build/linux-headless --evidence-dir artifacts/sdk-mutation
          python tests/agents_mutation.py --build-dir build/linux-headless --evidence-dir artifacts/agents-mutation
          python tests/agents_failure.py --build-dir build/linux-headless --evidence-dir artifacts/agents-failure
          python tests/agents_owner_test.py --build-dir build/linux-headless --evidence-dir artifacts/agents-owner
          python tests/policy_mutation.py --build-dir build/linux-headless --evidence-dir artifacts/policy-mutation
      - name: Configure, build and verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Install MSVC x64 build tools with toolset 14.44.35207.' }
          Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64 -vcvars_ver=14.44'
          python tools/bootstrap.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/protocol_mutation.py --build-dir build/windows-headless --evidence-dir artifacts/protocol-mutation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/objects_mutation.py --build-dir build/windows-headless --evidence-dir artifacts/objects-mutation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/sdk_mutation.py --build-dir build/windows-headless --evidence-dir artifacts/sdk-mutation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/agents_mutation.py --build-dir build/windows-headless --evidence-dir artifacts/agents-mutation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/agents_failure.py --build-dir build/windows-headless --evidence-dir artifacts/agents-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/agents_owner_test.py --build-dir build/windows-headless --evidence-dir artifacts/agents-owner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/policy_mutation.py --build-dir build/windows-headless --evidence-dir artifacts/policy-mutation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record candidate and fixture evidence
        shell: bash
        run: |
          git rev-parse HEAD
          python tests/bootstrap_oracle.py --executable "build/${{ runner.os == 'Windows' && 'windows-headless/omniweft_examples.exe' || 'linux-headless/omniweft_examples' }}" --evidence-dir artifacts/bootstrap
      - name: Record protocol validation evidence
        shell: bash
        run: |
          python tests/protocol_oracle.py --executable "build/${{ runner.os == 'Windows' && 'windows-headless/omniweft_examples.exe' || 'linux-headless/omniweft_examples' }}" --evidence-dir artifacts/protocol
      - name: Record atomic object evidence
        shell: bash
        run: |
          python tests/objects_oracle.py --executable "build/${{ runner.os == 'Windows' && 'windows-headless/omniweft_examples.exe' || 'linux-headless/omniweft_examples' }}" --evidence-dir artifacts/objects
      - name: Record authenticated SDK evidence
        shell: bash
        run: |
          python tests/sdk_oracle.py --executable "build/${{ runner.os == 'Windows' && 'windows-headless/omniweft_control.exe' || 'linux-headless/omniweft_control' }}" --evidence-dir artifacts/sdk
      - name: Record fixed-step provider evidence
        shell: bash
        run: |
          python tests/agents_oracle.py --executable "build/${{ runner.os == 'Windows' && 'windows-headless/omniweft_agents.exe' || 'linux-headless/omniweft_agents' }}" --headless --evidence-dir artifacts/agents
      - name: Record scoped policy evidence
        shell: bash
        run: |
          python tests/policy_oracle.py --executable "build/${{ runner.os == 'Windows' && 'windows-headless/omniweft_policy.exe' || 'linux-headless/omniweft_policy' }}" --evidence-dir artifacts/policy
      - name: Summarize retained evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("bootstrap", "protocol", "protocol-mutation", "objects", "objects-mutation"):
              manifest = json.loads((Path("artifacts") / name / "manifest.json").read_text(encoding="utf-8"))
              summary = {key: manifest[key] for key in ("work_item", "example", "candidate_sha", "candidate_worktree_dirty", "status", "environment")}
              summary["assertion_count"] = len(manifest["assertions"])
              summary["command_count"] = len(manifest["commands"])
              summary["result"] = manifest["artifacts"]["result"]
              summary["executable"] = manifest["artifacts"]["executable"]
              print(json.dumps({"evidence": name, **summary}, sort_keys=True))
          for name in ("sdk", "sdk-mutation", "agents", "agents-mutation", "agents-failure", "agents-owner", "policy", "policy-mutation"):
              manifest = json.loads((Path("artifacts") / name / "manifest.json").read_text(encoding="utf-8"))
              print(json.dumps({"evidence": name, "work_item": manifest["work_item"],
                                "candidate_sha": manifest["candidate_sha"], "dirty": manifest["dirty"],
                                "status": manifest["status"], "assertion_count": len(manifest["assertions"]),
                                "artifact_count": len(manifest["artifacts"])}, sort_keys=True))
          PY
      - name: Retain native evidence and CTest log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; official upstream pin
        with:
          name: bootstrap-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/bootstrap/
            artifacts/protocol/
            artifacts/protocol-mutation/
            artifacts/objects/
            artifacts/objects-mutation/
            artifacts/sdk/
            artifacts/sdk-mutation/
            artifacts/agents/
            artifacts/agents-mutation/
            artifacts/agents-failure/
            artifacts/agents-owner/
            artifacts/policy/
            artifacts/policy-mutation/
            build/*/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 7
